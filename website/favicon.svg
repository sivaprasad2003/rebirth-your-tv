<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- TV Body -->
  <rect x="6" y="10" width="52" height="38" rx="8" fill="#0B1120" stroke="url(#glowGrad)" stroke-width="2.5" />
  <!-- Screen Glass -->
  <rect x="10" y="14" width="44" height="30" rx="5" fill="#030712" />
  <!-- Screen Content Lightning / Pulse -->
  <path d="M30 18L24 30H32L30 40L42 27H34L37 18Z" fill="url(#glowGrad)" filter="url(#neon)" />
  <!-- TV Stand Base -->
  <path d="M22 54H42" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M32 48V54" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round" />
</svg>
